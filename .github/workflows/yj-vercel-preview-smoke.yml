name: YJ actual application Vercel Preview
on:
  push:
    branches: ['ops/vercel-preview-smoke-20261126']
permissions:
  contents: read
concurrency:
  group: yj-vercel-preview-smoke
  cancel-in-progress: false
jobs:
  actual-preview:
    if: github.repository == 'ss3172473-ctrl/YJtexlab'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: a5e98915aa9a50dd5c975148a8e236553fa3be06
          persist-credentials: false
          fetch-depth: 1
      - name: Prepare exact GitHub source without exposing build credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = a5e98915aa9a50dd5c975148a8e236553fa3be06
          mkdir "$RUNNER_TEMP/yj-src"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/yj-src"
          npm install --prefix "$RUNNER_TEMP/yj-cli" vercel@65.0.0 --no-audit --no-fund
      - name: Upload unchanged source to existing protected Preview only
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.YJ_VERCEL_PREVIEW_SMOKE_20261126 }}
          PROJECT_ID: prj_OsXUaLMXMpD9syk6enT3ON0Zvumi
          TEAM_ID: team_AA1YwlFrpTR74cNPVPOVOfHy
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          api() { printf 'Authorization: Bearer %s\n' "$VERCEL_TOKEN" | curl -fsS --max-time 20 -H @- "$@"; }
          current_only() { api "https://api.vercel.com/v9/projects/$PROJECT_ID?teamId=$TEAM_ID"; }
          current=$(current_only)
          jq -e --arg id "$PROJECT_ID" --arg name yjtexlab '.id==$id and .name==$name' <<<"$current" >/dev/null
          prod=$(jq -er '.targets.production.id' <<<"$current")
          cd "$RUNNER_TEMP/yj-src"
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s","projectName":"%s"}\n' "$TEAM_ID" "$PROJECT_ID" yjtexlab > .vercel/project.json
          url=$("$RUNNER_TEMP/yj-cli/node_modules/.bin/vercel" deploy --environment preview --archive=tgz --scope hello-52989247 --yes --meta yjSourceSha=a5e98915aa9a50dd5c975148a8e236553fa3be06 --token "$VERCEL_TOKEN")
          [[ "$url" =~ ^https://[a-zA-Z0-9-]+\.vercel\.app$ ]]
          host=${url#https://}
          api "https://api.vercel.com/v13/deployments/$host?teamId=$TEAM_ID" | jq -e --arg p "$PROJECT_ID" 'select(.projectId==$p and .readyState=="READY" and .target!="production")|{id,url,readyState,target}'
          test "$(current_only | jq -er '.targets.production.id')" = "$prod"
          echo "Approved source a5e98915aa9a50dd5c975148a8e236553fa3be06 ready as Preview; Production was not changed."